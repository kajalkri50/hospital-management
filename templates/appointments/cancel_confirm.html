{% extends "base.html" %}
{% block title %}Cancel appointment{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-xl font-bold text-slate-900">Cancel appointment?</h1>
  <p class="mt-2 text-sm text-slate-600">{{ appointment.hospital.name }} · {{ appointment.scheduled_at }}</p>
  <form method="post" class="mt-6 flex gap-3">
    {% csrf_token %}
    <button type="submit" class="rounded-xl bg-red-600 px-5 py-2 text-sm font-semibold text-white hover:bg-red-700">Yes, cancel</button>
    <a href="{% url 'appointments:history' %}" class="rounded-xl border border-slate-200 px-5 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Go back</a>
  </form>
</div>
{% endblock %}
