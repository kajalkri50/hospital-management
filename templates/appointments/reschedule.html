{% extends "base.html" %}
{% block title %}Reschedule{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg space-y-6">
  <h1 class="text-2xl font-bold text-slate-900">Reschedule appointment</h1>
  <p class="text-sm text-slate-600">{{ appointment.hospital.name }} · {{ appointment.doctor.display_name }}</p>
  <form method="get" class="flex items-end gap-2">
    <label class="text-sm">Date
      <input type="date" name="date" value="{{ on_date.isoformat }}" class="mt-1 rounded-lg border border-slate-200 px-3 py-2 text-sm">
    </label>
    <button type="submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Load slots</button>
  </form>
  <form method="post" class="space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    <fieldset>
      <legend class="text-sm font-semibold">New slot</legend>
      <div class="mt-2 flex flex-wrap gap-2">
        {% for slot in slots %}
          <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm">
            <input type="radio" name="scheduled_at" value="{{ slot.isoformat }}" required>
            {{ slot|date:"M j, Y H:i" }}
          </label>
        {% empty %}
          <p class="text-sm text-slate-500">No slots this day.</p>
        {% endfor %}
      </div>
    </fieldset>
    <button type="submit" class="rounded-xl bg-teal-600 px-5 py-2 text-sm font-semibold text-white hover:bg-teal-800">Save new time</button>
  </form>
</div>
{% endblock %}
