{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-bold text-slate-900">Login</h1>
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {% if redirect_field_value %}
    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}
    {% if form.non_field_errors %}
      <div class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800">{{ form.non_field_errors }}</div>
    {% endif %}
    <label class="block text-sm">Username
      {{ form.username }}
    </label>
    <label class="block text-sm">Password
      {{ form.password }}
    </label>
    <style>form input[type=text], form input[type=password] { margin-top:0.25rem; width:100%; border-radius:0.5rem; border:1px solid #e2e8f0; padding:0.5rem 0.75rem; font-size:0.875rem; }</style>
    <button type="submit" class="w-full rounded-xl bg-teal-600 py-2.5 text-sm font-semibold text-white hover:bg-teal-800">Sign in</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-600">New patient? <a href="{% url 'accounts:register' %}" class="text-teal-800 hover:underline">Create account</a></p>
</div>
{% endblock %}
